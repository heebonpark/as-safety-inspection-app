<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AS 및 공사현장 안전점검 일일 보고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<style>
  :root{
    --ink:#1b2a2e;
    --ink-soft:#4d5d5f;
    --paper:#eef1ef;
    --surface:#ffffff;
    --line:#c7d1cf;
    --line-soft:#dfe6e4;
    --brand:#0d4f5c;
    --brand-deep:#0a3b45;
    --amber:#d98c1f;
    --red:#b0392b;
    --green:#2f7d5f;
    --radius:10px;
    --shadow:0 1px 2px rgba(15,30,32,.06), 0 8px 24px rgba(15,30,32,.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans KR',sans-serif;
    background:radial-gradient(1200px 600px at 100% -10%, rgba(13,79,92,.06), transparent 60%), var(--paper);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:rgba(13,79,92,.18);}

  #app{min-height:100vh;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 14px;padding:14px 22px;background:var(--brand-deep);color:#eef4f2;box-shadow:var(--shadow);}
  .topbar .brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.2px;}
  .topbar .brand .dot{width:10px;height:10px;border-radius:2px;background:var(--amber);flex:none;}
  .topbar .brand .sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#a9c2bd;font-weight:500;margin-left:6px;}
  .topbar .who{display:flex;align-items:center;gap:12px;font-size:13px;color:#cfe3df;white-space:nowrap;}
  .topbar button.link{background:transparent;border:1px solid rgba(255,255,255,.28);color:#eef4f2;padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:500;}
  .topbar button.link:hover{background:rgba(255,255,255,.1);}

  main{flex:1;display:flex;justify-content:center;padding:26px 16px 60px;}
  .shell{width:100%;max-width:1040px;}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:100%;max-width:460px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line-soft);overflow:hidden;}
  .login-head{background:linear-gradient(135deg,var(--brand-deep),var(--brand));color:#eef4f2;padding:28px 28px 22px;}
  .login-head .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#a9c2bd;text-transform:uppercase;}
  .login-head h1{margin:6px 0 4px;font-size:21px;font-weight:900;line-height:1.35;}
  .login-head p{margin:0;font-size:12.5px;color:#bcd6d1;}
  .tabs{display:flex;border-bottom:1px solid var(--line-soft);}
  .tab{flex:1;text-align:center;padding:13px 8px;font-size:13.5px;font-weight:700;color:var(--ink-soft);background:#f6f8f7;border:none;border-bottom:3px solid transparent;}
  .tab.active{color:var(--brand-deep);background:var(--surface);border-bottom-color:var(--amber);}
  .login-body{padding:24px 26px 28px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  .field select, .field input[type=text], .field input[type=password], .field input[type=date]{
    width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;color:var(--ink);background:#fff;
  }
  .field select:focus,.field input:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(13,79,92,.12);}
  .btn-primary{width:100%;padding:12px;border:none;border-radius:9px;background:var(--brand-deep);color:#fff;font-weight:700;font-size:14.5px;margin-top:6px;transition:background .15s;}
  .btn-primary:hover{background:var(--brand);}
  .btn-primary:disabled{background:#aab6b4;cursor:not-allowed;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:10px;line-height:1.6;}
  .err{color:var(--red);font-size:12.5px;font-weight:600;margin-top:8px;}

  .btn{padding:9px 16px;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:13px;font-weight:700;}
  .btn:hover{border-color:var(--brand);color:var(--brand-deep);}
  .btn.solid{background:var(--brand-deep);border-color:var(--brand-deep);color:#fff;}
  .btn.solid:hover{background:var(--brand);}
  .btn.danger{color:var(--red);border-color:#e6c3bd;}
  .btn.danger:hover{background:#fdf1ef;border-color:var(--red);}
  .btn.warn{color:#8a5a12;border-color:#e7c88e;background:#fdf3e2;}
  .btn.warn:hover{background:#fbe9c9;}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft);}

  .formtabs{display:flex;gap:6px;margin-bottom:14px;}
  .ftab{padding:9px 16px;border-radius:8px 8px 0 0;border:1.5px solid var(--line-soft);border-bottom:none;background:#e7edec;color:var(--ink-soft);font-size:13px;font-weight:700;}
  .ftab.active{background:var(--surface);color:var(--brand-deep);border-color:var(--line-soft);box-shadow:0 -2px 0 var(--amber) inset;}

  table.grid th.req::after{content:" *";color:var(--red);font-weight:900;}

  .actionbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .actionbar .title{font-size:15px;font-weight:900;color:var(--brand-deep);}
  .actionbar .title .mono{font-size:11.5px;color:var(--ink-soft);font-weight:500;display:block;margin-top:2px;}
  .actionbar .btns{display:flex;gap:8px;flex-wrap:wrap;}

  .sheet{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--line-soft);padding:26px 30px 30px;}
  .sheet h2.formtitle{text-align:center;font-size:19px;font-weight:900;letter-spacing:.5px;color:var(--brand-deep);margin:2px 0 4px;}
  .sheet .formtitle-sub{text-align:center;font-size:11px;color:var(--ink-soft);margin-bottom:16px;font-family:'IBM Plex Mono',monospace;}

  table.grid{width:100%;border-collapse:collapse;margin-bottom:14px;table-layout:fixed;}
  table.grid th, table.grid td{border:1px solid var(--line);padding:7px 9px;font-size:12.5px;vertical-align:middle;overflow:hidden;}
  table.grid th{background:#f3f6f5;color:var(--brand-deep);font-weight:700;text-align:left;white-space:nowrap;}
  table.grid td input[type=text], table.grid td input[type=date]{width:100%;border:none;background:transparent;font-size:13px;padding:3px 2px;color:var(--ink);}
  table.grid td input:focus{outline:none;background:#f6faf9;border-radius:4px;}
  table.grid td select{width:100%;font-size:13px;font-family:inherit;color:var(--ink);padding:3px 2px;background:transparent;}
  table.grid td select:disabled{-webkit-appearance:none;-moz-appearance:none;appearance:none;border:none;background:transparent;opacity:1;-webkit-text-fill-color:var(--ink);padding:3px 2px;}
  table.check td.action input:disabled::placeholder{color:transparent;}
  table.grid td.radiocell{display:flex;gap:10px;align-items:center;}
  table.grid td.radiocell label{display:flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap;}
  table.grid td.radiocell input{accent-color:var(--brand-deep);width:13px;height:13px;}

  .section-label{font-size:12.5px;font-weight:900;color:#fff;background:var(--brand-deep);padding:6px 10px;border-radius:6px 6px 0 0;display:inline-block;margin-bottom:0;}

  table.check{width:100%;border-collapse:collapse;margin-bottom:14px;table-layout:fixed;}
  table.check th{background:var(--brand-deep);color:#fff;font-size:11.5px;font-weight:700;padding:7px 8px;text-align:center;}
  table.check td{border:1px solid var(--line);padding:7px 8px;font-size:12.3px;vertical-align:middle;}
  table.check td.gu{width:64px;text-align:center;font-weight:900;color:var(--brand-deep);background:#f3f6f5;}
  table.check td.item{line-height:1.5;}
  table.check td.item .note{display:block;font-size:11px;color:var(--red);margin-top:2px;}
  table.check td.result{width:150px;}
  table.check td.action{width:170px;}
  .result-opts{display:flex;gap:8px;justify-content:center;flex-wrap:nowrap;}
  .result-opt{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--ink-soft);white-space:nowrap;}
  .result-opt input{accent-color:var(--brand-deep);width:14px;height:14px;}
  .result-opt.good{color:var(--green);}
  .result-opt.bad{color:var(--red);}
  table.check td.action input{width:100%;border:none;background:transparent;font-size:12px;padding:2px 0;}
  table.check td.action input:focus{outline:none;border-bottom-color:var(--brand);}

  .photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:0 6px 6px 6px;overflow:hidden;margin-bottom:14px;}
  @media (max-width:640px){ .photo-grid{grid-template-columns:1fr;} }
  .photo-cell{background:#fff;padding:10px;display:flex;flex-direction:column;gap:8px;}
  .photo-cell .plabel{font-size:12px;font-weight:700;color:var(--brand-deep);text-align:center;}
  .photo-box{position:relative;width:100%;aspect-ratio:4/3;border:1.5px dashed var(--line);border-radius:8px;background:#fafcfb;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;}
  .photo-box img{width:100%;height:100%;object-fit:cover;}
  .photo-box .ph{font-size:12px;color:var(--ink-soft);text-align:center;padding:0 10px;}
  .photo-box input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .photo-clear{border:none;background:transparent;color:var(--red);font-size:11px;font-weight:700;text-decoration:underline;padding:0;align-self:center;}

  .remarks-box{margin-bottom:14px;border:1px solid var(--line);border-radius:0 0 6px 6px;padding:10px 12px;}
  td.sig-inline{display:flex;align-items:center;gap:4px;}
  td.sig-inline input{flex:1;min-width:0;}
  td.sig-inline .ins-mark{flex:none;color:var(--ink-soft);}

  textarea.wide{width:100%;min-height:44px;border:none;background:transparent;padding:0;font-size:12.8px;resize:vertical;}
  textarea.wide:focus{outline:none;}

  .meta-footer{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  /* 화면(편집 중)에서는 안 보이다가 실제 인쇄(@media print)에서만 나타난다 — 점검자가
     방금 작성한 폼(읽기전용 아님)을 바로 "인쇄/PDF"로 찍을 때도 QR이 들어가야 하므로,
     dis(읽기전용) 여부와 무관하게 항상 마크업 자체는 만들어두고 표시만 인쇄에서 켠다. */
  .qr-block{display:none;justify-content:flex-end;align-items:center;gap:6px;margin-top:4px;}
  .qr-block img{width:54px;height:54px;}
  .qr-block .qr-label{font-size:9.5px;color:var(--ink-soft);text-align:right;line-height:1.3;}

  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .stat{flex:1;min-width:140px;background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);}
  .stat .n{font-size:24px;font-weight:900;color:var(--brand-deep);font-family:'IBM Plex Mono',monospace;}
  .stat .l{font-size:11.5px;color:var(--ink-soft);font-weight:700;margin-top:2px;}
  .trend-row{display:grid;grid-template-columns:64px 1fr 90px;align-items:center;gap:10px;padding:5px 0;font-size:12px;}
  .trend-row .lb{color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .trend-track{position:relative;height:16px;background:var(--paper);border-radius:5px;overflow:hidden;}
  .trend-fill-total{position:absolute;top:0;left:0;bottom:0;background:var(--brand);border-radius:5px;}
  .trend-fill-bad{position:absolute;top:0;left:0;bottom:0;background:var(--red);border-radius:5px;}
  .trend-row .vv{text-align:right;font-family:'IBM Plex Mono',monospace;color:var(--ink);}
  .rank-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .rank-table th{text-align:left;padding:6px 8px;color:var(--ink-soft);font-size:11px;border-bottom:1px solid var(--line);}
  .rank-table td{padding:6px 8px;border-bottom:1px solid var(--line-soft);}
  .rank-table td.num{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .rank-table td.pct{text-align:right;font-family:'IBM Plex Mono',monospace;color:var(--red);font-weight:700;}
  .panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px;}
  .panel h3{margin:0 0 12px;font-size:14px;font-weight:900;color:var(--brand-deep);display:flex;align-items:center;gap:8px;}
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .chip{padding:6px 13px;border-radius:20px;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);font-size:12px;font-weight:700;cursor:pointer;}
  .chip.active{background:var(--brand-deep);border-color:var(--brand-deep);color:#fff;}
  .filters input,.filters select{padding:8px 10px;border:1.5px solid var(--line);border-radius:7px;font-size:12.8px;}
  .filters input[type=text]{flex:1;min-width:160px;}
  table.list{width:100%;border-collapse:collapse;}
  table.list th{text-align:left;font-size:11.5px;color:var(--ink-soft);font-weight:700;padding:8px;border-bottom:2px solid var(--line);text-transform:uppercase;letter-spacing:.3px;}
  table.list td{padding:9px 8px;font-size:13px;border-bottom:1px solid var(--line-soft);}
  table.list tr:hover td{background:#f6faf9;}
  table.list .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.8px;font-weight:700;}
  .badge.ok{background:#e4f3ec;color:var(--green);}
  .badge.bad{background:#fbe9e6;color:var(--red);}
  .badge.done{background:#e7edfb;color:#2851a3;}
  .rowbtns{display:flex;gap:6px;}
  .rowbtns button{padding:5px 10px;font-size:11.5px;}
  .empty{text-align:center;padding:40px 10px;color:var(--ink-soft);font-size:13px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--brand-deep);color:#fff;padding:11px 20px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:100;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .sig-modal-backdrop{position:fixed;inset:0;background:rgba(15,30,32,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
  .sig-modal{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;width:100%;max-width:360px;}
  .sig-modal h3{margin:0 0 10px;font-size:15px;color:var(--brand-deep);}
  .sig-modal canvas{width:100%;height:160px;border:1px dashed var(--line);border-radius:6px;background:#fdfefe;touch-action:none;display:block;}
  .sig-modal .row{display:flex;gap:8px;margin-top:12px;}
  .sig-modal .row button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;}
  .sig-modal .row button.primary{background:var(--brand-deep);color:#fff;border-color:var(--brand-deep);}
  .sig-modal .hint{font-size:11px;color:var(--ink-soft);margin-top:8px;}

  .export-modal-backdrop{position:fixed;inset:0;background:rgba(15,30,32,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;}
  .export-modal{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;width:100%;max-width:360px;}
  .export-modal h3{margin:0 0 4px;font-size:15px;color:var(--brand-deep);}
  .export-modal .hint{font-size:11.5px;color:var(--ink-soft);margin-bottom:12px;}
  .export-modal .opt{display:block;width:100%;text-align:left;padding:11px 13px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px;}
  .export-modal .opt .sub{display:block;font-size:11px;font-weight:500;color:var(--ink-soft);margin-top:2px;}
  .export-modal .opt:hover{border-color:var(--brand);background:#f6faf9;}
  .export-modal .cancel{display:block;width:100%;text-align:center;padding:9px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--ink-soft);margin-top:4px;}

  .ins-mark{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:52px;height:38px;}
  .ins-mark.readonly{cursor:default;}
  .ins-mark img.sig-stamp-img{width:52px;height:38px;object-fit:contain;}

  footer.appfoot{text-align:center;padding:16px;font-size:11px;color:var(--ink-soft);}

  #print-all-root{display:none;}
  #print-all-root .print-page{page-break-after:always;margin-bottom:24px;}
  #print-all-root .print-page:last-child{page-break-after:auto;}

  /* 인쇄 스타일 — 서명판을 없애면서 확보한 공간과, 표 행 높이·사진 크기를 함께
     줄여서 A4 한 장에 들어가도록 한다(사진이 화면용 4:3 비율 그대로 인쇄되면
     그것만으로 한 페이지 대부분을 차지해서, 표 행 높이만 줄여서는 한 장에 담기
     어렵다 — 그래서 사진 박스 높이도 인쇄용으로 고정값을 준다). */
  @page{ size:A4; margin:7mm; }
  @media print{
    body{background:#fff;-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}
    .no-print{display:none !important;}
    .sig-modal-backdrop, .export-modal-backdrop{display:none !important;}
    /* 관리자 화면에서 "선택/전체 인쇄"를 누르면 개별 보고서 시트를 담은
       #print-all-root를 body에 새로 붙여 넣고 인쇄하는데, 정작 그 뒤에 있던
       관리자 목록(표·필터·통계)을 인쇄용으로 숨기는 규칙이 빠져 있어서 목록
       화면까지 같이 인쇄되던 문제가 있었다 — 목록은 숨기고 시트만 보이게 한다. */
    body.printing-all main{display:none !important;}
    body.printing-all #print-all-root{display:block !important;}
    main{padding:0;display:block;}
    .shell{max-width:none;}
    .sheet{box-shadow:none;border:none;border-radius:0;padding:0;}
    .photo-clear{display:none !important;}
    input::placeholder, textarea::placeholder{color:transparent !important;}
    input[type=text], textarea{border:none !important;background:transparent !important;overflow:visible !important;}
    table.check td.action input{border-bottom:none !important;}
    table.grid td select{-webkit-appearance:none;-moz-appearance:none;appearance:none;border:none !important;background:transparent !important;padding:1px 2px !important;font:inherit !important;color:#1b2a2e !important;opacity:1 !important;-webkit-text-fill-color:#1b2a2e !important;}
    .formtitle-sub{display:none !important;}
    table{page-break-inside:auto;}
    tr, td, th, .section-label, .photo-cell, .remarks-box{page-break-inside:avoid;}
    table.grid th, table.grid td, table.check th, table.check td{border:1px solid #333 !important;}
    .photo-box{border:1px solid #333 !important;}
    .photo-caption, .remarks-box{border-color:#333 !important;}
    .photo-box input[type=file]{display:none !important;}

    .sheet h2.formtitle{font-size:19px;margin:0 0 5px;}
    .section-label{font-size:10.5px;padding:3px 8px;margin-top:5px;}
    table.grid th, table.grid td{font-size:10px;padding:2px 5px;}
    table.grid td.radiocell{gap:6px;}
    table.grid td.radiocell label{font-size:9px;gap:2px;}
    table.grid td.radiocell input{width:10px;height:10px;}
    .ins-mark{width:36px;height:28px;}
    .ins-mark img.sig-stamp-img{width:36px;height:28px;}

/* ---------------- storage helpers ---------------- */
async function sGet(key){
  try{ const s = await getDoc(doc(db, COLLECTION, key)); return s.exists() ? s.data().value : null; }
  catch(e){ return null; }
}
async function sSet(key, value){
  try{ await setDoc(doc(db, COLLECTION, key), { value }); return true; }
  catch(e){ console.error("storage set failed", e); return null; }
}
async function sListValues(prefix){
  try{
    const values = [];
    const qs = await getDocs(collection(db, COLLECTION));
    qs.forEach(d=>{ if(d.id.startsWith(prefix)) values.push(d.data().value); });
    return values;
  }catch(e){ return []; }
}
async function sDelete(key){

  catch(e){ return null; }
}

/* 비고 아래 "작성자/지사 · 작성(수정)일시" 줄(.meta-footer)을 화면·인쇄·PDF/HTML

// 사진은 Firestore 문서 1개(1MB 제한) 안에 텍스트와 함께 저장하므로, 올리자마자
// 캔버스로 축소·재압축해서 용량을 크게 줄인다(별도 파일 저장소를 새로 구축할
// 필요 없이 지금 있는 Firestore 하나로 충분하게).
/* GPS 위치를 최대 timeoutMs만 기다려보고, 권한 거부·타임아웃·위치서비스 꺼짐 등
   어떤 이유로든 실패하면 조용히 null을 준다(사진 자체는 GPS 없이도 계속 처리돼야
   하므로 여기서 절대 reject하지 않음). */
function getGeoPositionSafe(timeoutMs){
  return new Promise(resolve=>{
    if(!navigator.geolocation){ resolve(null); return; }
    let done = false;
    const finish = (pos)=>{ if(done) return; done = true; resolve(pos); };
    const timer = setTimeout(()=>finish(null), timeoutMs);
    navigator.geolocation.getCurrentPosition(
      pos=>{ clearTimeout(timer); finish(pos); },
      ()=>{ clearTimeout(timer); finish(null); },
      { timeout: timeoutMs, maximumAge: 60000 }
    );
  });
}
function watermarkText(pos){
  const now = new Date();
  const ts = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} `
    + `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  if(pos && pos.coords) return `${ts}  ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
  return ts;
}
function compressImageFile(file){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = async ()=>{
      URL.revokeObjectURL(url);
      const maxDim = 720;
      let {width, height} = img;
      if(width > height && width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; }
      else if(height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      // 현장 증빙 신뢰도를 위해 촬영시각(+가능하면 GPS 좌표)을 사진 하단에 워터마크로
      // 새겨 넣는다. 위치 권한이 없거나 실내/PC 업로드라 GPS가 안 잡히면 시각만 찍는다.
      try{
        const pos = await getGeoPositionSafe(4000);
        const text = watermarkText(pos);
        const barH = Math.max(16, Math.round(height*0.07));
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, height-barH, width, barH);
        ctx.fillStyle = '#fff';
        ctx.font = `${Math.round(barH*0.55)}px sans-serif`;
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 6, height-barH/2);
      }catch(e){ /* 워터마크가 실패해도 사진 처리 자체는 계속 진행 */ }
      let quality = 0.62;
      let dataUrl = canvas.toDataURL('image/jpeg', quality);
      while(dataUrl.length > 260000 && quality > 0.25){
        quality -= 0.1;
        dataUrl = canvas.toDataURL('image/jpeg', quality);
      }
      resolve(dataUrl);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('이미지를 읽을 수 없습니다.')); };
    img.src = url;
  });
}

/* ---------------- 작성 중 임시저장(초안) ----------------
   현장(모바일)에서 작성 중 화면 전환·네트워크 끊김으로 입력 내용이 통째로
   날아가는 걸 막기 위해, "새 보고서 작성" 중일 때만(기존 보고서 수정 중에는
   원본과 섞이지 않도록 저장 안 함) 지사+점검자 이름별로 이 브라우저에 초안을
   남긴다. 제출에 성공하면 그 초안은 지운다. 사진(base64)까지 포함해 매 입력마다
   그대로 쓰면 무거우므로 800ms 디바운스로 묶어서 쓴다. */
function draftKey(branch, name){ return `asDraft:${branch}||${name}`; }
let _draftSaveTimer = null;
function scheduleDraftSave(f){
  if(state.editingRecordId) return; // 기존 보고서 수정 중에는 초안을 남기지 않음
  clearTimeout(_draftSaveTimer);
  _draftSaveTimer = setTimeout(()=>{
    try{ localStorage.setItem(draftKey(f.branch, f.inspectorName), JSON.stringify(f)); }catch(e){}
  }, 800);
}
function loadDraft(branch, name){
  try{ const raw = localStorage.getItem(draftKey(branch, name)); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function clearDraft(branch, name){
  try{ localStorage.removeItem(draftKey(branch, name)); }catch(e){}
}
// 빈 양식과 사실상 같으면(아무 입력도 없으면) "복원할지 물어볼 가치가 있는 초안"으로 치지 않는다.
function draftHasContent(f){
  if(!f) return false;
  if(f.companyName || f.contractNo || f.teamName || f.workerName || f.siteAddress || f.remarks) return true;
  return (f.checklist||[]).some(c=>c.result || c.note || c.photo);
}

async function loadRecords(){

async function loadVendors(){
  const raw = await sGet("config:vendors");
  if(raw){
    try{ const parsed = JSON.parse(raw); if(Array.isArray(parsed)) return parsed; }catch(e){}
  }
  return DEFAULT_VENDOR_NAMES.map(name=>({name, teams:[]}));
}
async function saveVendors(){

}

/* 지사별 관리자 비밀번호 — {지사명: 비밀번호} 맵. ADMIN_PASSWORD(본부/전체 관리자)는
   그대로 두고, 이 맵에 등록된 지사만 그 지사 전용 비밀번호로 로그인할 수 있다.
   등록 안 된 지사는 지사 관리자 로그인 자체가 없고(본부 관리자만 그 지사 데이터를
   봄), 비밀번호를 빈칸으로 저장하면 그 지사 로그인을 다시 끈 것과 같다. */
async function loadBranchAdminPw(){
  const raw = await sGet("config:branchAdminPw");
  if(raw){ try{ const parsed = JSON.parse(raw); if(parsed && typeof parsed==='object') return parsed; }catch(e){} }
  return {};
}
async function saveBranchAdminPw(map){

}
// 관리자 로그인 시 매번 최신 상태를 Firestore에서 새로 읽어와야, 다른 관리자가
// 방금 바꾼 지사 비밀번호가 바로 반영된다(state에 캐시해두고 쓰면 오래된 값으로
// 로그인 판정을 할 위험이 있음).
function scopedRecords(){
  return state.adminScope ? state.records.filter(r=>r.branch===state.adminScope) : state.records;
}

/* 미흡 발생 자동 알림(웹훅) — Slack/Discord 등 "수신 웹훅" URL 하나를 관리자가
   등록해두면, 미흡 항목이 있는 보고서가 제출될 때마다 그 URL로 알림을 보낸다.
   어느 서비스인지 미리 알 수 없어 text(Slack)와 content(Discord) 필드를 함께
   보낸다 — 대부분의 웹훅 수신측은 모르는 필드는 그냥 무시하므로 안전하다. */
async function loadNotifyConfig(){
  const raw = await sGet("config:notifyWebhook");
  if(raw){ try{ const p = JSON.parse(raw); if(p && typeof p==='object') return { url:'', enabled:false, ...p }; }catch(e){} }
  return { url:'', enabled:false };
}
async function saveNotifyConfig(cfg){
  await sSet("config:notifyWebhook", JSON.stringify(cfg));
}
function buildBadResultMessage(rec){
  const badItems = (rec.checklist||[]).map((c,i)=> c.result==='bad' ? `${i+1}. ${(CHECK_ITEMS[i]&&CHECK_ITEMS[i].label)||''}${c.note?` — ${c.note}`:''}` : null).filter(Boolean);
  const verifyUrl = `${QR_VERIFY_BASE_URL}?verify=${rec.id}`;
  return `⚠ 안전점검 미흡 발생\n지사: ${rec.branch||'-'} / 상호: ${rec.companyName||'-'}\n현장: ${rec.siteAddress||'-'}\n점검자: ${rec.inspectorName||'-'} (${rec.inspectDate||''})\n미흡 항목:\n${badItems.join('\n')}\n\n확인: ${verifyUrl}`;
}
async function sendWebhook(url, message){
  await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: message, content: message }),
  });
}
// 제출 흐름 자체는 알림 성공/실패와 무관하게 이미 끝난 뒤이므로, 여기서 나는 에러는
// 조용히 삼킨다(사용자에게 "제출은 됐는데 알림만 실패"라는 걸 굳이 보여줄 필요 없음 —
// 관리자가 "테스트 전송"으로 웹훅 자체가 살아있는지는 별도로 확인할 수 있음).
async function sendBadResultNotification(rec){
  try{
    const cfg = await loadNotifyConfig();
    if(!cfg.enabled || !cfg.url) return;
    await sendWebhook(cfg.url, buildBadResultMessage(rec));
  }catch(e){ /* 무시 */ }
}

function bindLogin(){
  const tabReg = document.getElementById('tab-reg');
  const tabAdmin = document.getElementById('tab-admin');
  const paneReg = document.getElementById('pane-reg');
  const paneAdmin = document.getElementById('pane-admin');
  tabReg.onclick = ()=>{ tabReg.classList.add('active'); tabAdmin.classList.remove('active'); paneReg.style.display='block'; paneAdmin.style.display='none'; };
  tabAdmin.onclick = ()=>{ tabAdmin.classList.add('active'); tabReg.classList.remove('active'); paneAdmin.style.display='block'; paneReg.style.display='none'; };

  // 관리지사를 고르면 지사별 기본 점검자 이름을 자동으로 채운다(직접 수정 가능하도록
  // 이름칸이 비어 있거나 아직 자동채움 값 그대로일 때만 덮어쓴다).
  const inBranch = document.getElementById('in-branch');
  const inName = document.getElementById('in-name');
  inBranch.addEventListener('change', ()=>{
    const def = INSPECTOR_DEFAULTS[inBranch.value];
    const isUntouched = !inName.value || Object.values(INSPECTOR_DEFAULTS).includes(inName.value);
    if(def && isUntouched) inName.value = def;
  });

  document.getElementById('btn-reg-start').onclick = ()=>{
    const branch = document.getElementById('in-branch').value;
    const name = document.getElementById('in-name').value.trim();
    if(!branch){ toast("관리지사를 선택해 주세요."); return; }
    if(!name){ toast("점검자 이름을 입력해 주세요."); return; }
    state.role = "inspector";
    state.inspector = {branch, name};
    state.editingRecordId = null;
    const draft = loadDraft(branch, name);
    if(draftHasContent(draft) && confirm("작성 중 저장이 안 된 보고서 초안이 있습니다. 이어서 작성하시겠습니까?\n(취소를 누르면 새 보고서로 시작하고, 기존 초안은 그대로 남습니다)")){
      state.currentForm = draft;
    }else{
      state.currentForm = blankForm({branch, name});
    }
    state.view = "form";
    render();
  };

  document.getElementById('btn-admin-login').onclick = async ()=>{
    const pw = document.getElementById('in-admin-pw').value;
    if(pw === ADMIN_PASSWORD){
      state.role = "admin";
      state.adminScope = null; // 본부(전체) 관리자
      await loadRecords();
      state.view = "admin";
      render();
      return;
    }
    // 본부 비밀번호가 아니면, 등록된 지사별 관리자 비밀번호와도 비교한다. 매번
    // Firestore에서 새로 읽어와야 다른 관리자가 방금 바꾼 비밀번호가 바로 반영된다.
    const branchPw = await loadBranchAdminPw();
    const matchedBranch = Object.keys(branchPw).find(b=> branchPw[b] && branchPw[b] === pw);
    if(matchedBranch){
      state.role = "admin";
      state.adminScope = matchedBranch;
      await loadRecords();
      state.view = "admin";
      render();
    }else{
      document.getElementById('admin-err').style.display = 'block';
    }
  };
  document.getElementById('in-admin-pw').addEventListener('keydown', e=>{
    if(e.key === 'Enter') document.getElementById('btn-admin-login').click();
  });
}

function renderFormInto(root, opts){
  opts = opts || {};
  const readOnly = !!opts.readOnly;
  const fromAdmin = !!opts.fromAdmin;
  const f = state.currentForm;
  root.innerHTML = `
    <div class="actionbar no-print">
      <div class="title">${readOnly ? '점검 보고서 보기' : (state.editingRecordId ? '점검 보고서 수정' : '새 점검 보고서 작성')}
        <span class="mono">${esc(f.siteAddress || '')}</span>
      </div>
      <div class="btns">
        <label style="display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;">
          <input type="checkbox" id="chk-meta-footer" ${metaFooterVisible()?'checked':''}> 작성자/작성일시 표시
        </label>
        ${fromAdmin ? `<button class="btn" id="btn-back-admin">← 목록으로</button>` : (state.role==='inspector' ? `<button class="btn" id="btn-my-list">📋 내가 등록한 보고서</button>` : '')}
        <button class="btn" id="btn-print">🖨 인쇄/PDF</button>
        ${!readOnly ? `<button class="btn solid" id="btn-submit">${state.editingRecordId ? '수정 저장' : '제출'}</button>` : ''}
      </div>
    </div>
    <div class="sheet" id="sheet"></div>
    ${!fromAdmin && state.role==='inspector' ? `<div class="panel" id="mine-panel" style="display:none;"></div>` : ''}
  `;
  // 인쇄/제출 같은 핵심 버튼은 아래 시트(양식 본문) 렌더링보다 먼저 연결한다 — 혹시
  // 시트 쪽 렌더링(체크리스트·사진)에서 예외가 나더라도 인쇄 버튼 자체는 항상
  // 눌리게 하기 위함이다. print() 자체도 try/catch로 감싸 실패 시 화면에 표시한다.
  document.getElementById('btn-print').onclick = ()=>{
    try{
      window.print();
    }catch(e){
      console.error("인쇄 실패", e);
      toast("인쇄를 여는 중 오류가 발생했습니다: " + (e && e.message ? e.message : e));
    }
  };
  document.getElementById('chk-meta-footer').onchange = (e)=>{
    setMetaFooterVisible(e.target.checked);
    renderSheet(document.getElementById('sheet'), f, readOnly);
  };
  if(!readOnly){
    document.getElementById('btn-submit').onclick = submitForm;
  }
  if(fromAdmin){
    document.getElementById('btn-back-admin').onclick = ()=>{ state.view='admin'; render(); };
  }else if(state.role==='inspector'){
    document.getElementById('btn-my-list').onclick = async ()=>{
      const panel = document.getElementById('mine-panel');
      const showing = panel.style.display !== 'none';
      if(showing){ panel.style.display='none'; return; }
      await loadRecords();
      renderMineListInto(panel);
      panel.style.display='block';
    };
  }
  try{
    renderSheet(document.getElementById('sheet'), f, readOnly);
  }catch(e){
    console.error("renderSheet 실패", e);
    toast("양식 화면을 표시하는 중 문제가 있었습니다. 새로고침 후 다시 시도해 주세요.");
  }
}

function renderMineListInto(root){
  const mine = state.records.filter(r=>r.branch===state.inspector.branch && r.inspectorName===state.inspector.name);
  root.innerHTML = `<h3>내가 등록한 보고서 (${mine.length}건)</h3>` +
    (mine.length===0 ? `<div class="empty">등록한 보고서가 없습니다.</div>` :
    `<table class="list"><tr><th>점검일자</th><th>상호</th><th>현장주소</th><th>상태</th><th></th></tr>${mine.map(r=>{

        <td>${esc(r.companyName||'-')}</td>

/* 인쇄물 위변조 확인용 QR — 스캔하면 이 보고서의 디지털 원본을 그대로 보여주는
   페이지(?verify=<id>)로 연결된다. 로그인 없이 볼 수 있는 별도의 읽기 전용 경로라
   실제 Firestore 원본과 대조가 가능해진다(자세한 위험/완화 설명은 renderVerifyView
   주석 참고). QRious는 생성자 호출 즉시 동기적으로 캔버스에 그리므로, 여기서도
   sheetOuterHTML()처럼 동기 함수인 채로 바로 dataURL을 만들어 문자열에 박아 넣을 수
   있다(비동기로 만들면 이 함수를 호출하는 모든 곳—인쇄/ZIP/정적 문서 내보내기 등—을
   전부 고쳐야 해서 훨씬 번거로움). */
const QR_VERIFY_BASE_URL = 'https://heebonpark.github.io/as-safety-inspection-app/';
function qrVerifyDataUrl(recordId, sizePx){
  if(typeof QRious === 'undefined') return '';
  try{
    const canvas = document.createElement('canvas');
    new QRious({ element: canvas, value: `${QR_VERIFY_BASE_URL}?verify=${recordId}`, size: sizePx, level: 'M' });
    return canvas.toDataURL('image/png');
  }catch(e){ return ''; }
}

function selectHTML(field, list, value, dis){
  // 목록에 없는 값(과거 자유입력으로 저장된 데이터 등)이 이미 저장돼 있으면
  // 화면에서 엉뚱한 항목이 선택된 것처럼 보이지 않도록 그 값을 옵션으로 끼워 넣는다.
  const extra = (value && !list.includes(value)) ? `<option value="${esc(value)}" selected>${esc(value)}</option>` : '';
  return `<select data-field="${field}" ${dis}>` + `<option value="">선택</option>` + extra +
    list.map(v=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(v)}</option>`).join("") + `</select>`;
}

function renderSheet(el, f, readOnly){
  const dis = readOnly ? 'disabled' : '';
  el.innerHTML = sheetOuterHTML(f, dis);
  bindFormInputs(el, f, readOnly);
  setupSigStamp(el, f, readOnly);
}

// "(인)" 자리를 눌러 전자서명을 하면 그 서명 이미지를 (인) 자리에 딱 맞는 작은
// 도장 크기로 겹쳐 보이게 한다(화면·인쇄 동일). 서명 캔버스는 (인) 자체가 너무
// 작아 그 안에서 직접 그리기 어려워서 별도의 큰 모달에서 그리게 하고, 저장된
// 결과만 축소해서 (인) 위치에 대신 표시한다.
function setupSigStamp(el, f, readOnly){
  const mark = el.querySelector('.ins-mark');
  if(!mark || readOnly) return;
  mark.onclick = ()=>{
    openSignatureModal(f.inspectorSig, (dataUrl)=>{
      f.inspectorSig = dataUrl;
      mark.innerHTML = dataUrl ? `<img class="sig-stamp-img" src="${dataUrl}" alt="서명">` : '(인)';
    });
  };
}

function openSignatureModal(existingSig, onSave){
  const backdrop = document.createElement('div');
  backdrop.className = 'sig-modal-backdrop';
  backdrop.innerHTML = `
    <div class="sig-modal">
      <h3>전자서명</h3>
      <canvas width="320" height="160"></canvas>
      <div class="hint">여기에 서명하면 "(인)" 자리에 작은 도장 크기로 표시됩니다.</div>
      <div class="row">
        <button type="button" data-sig-clear>지우기</button>
        <button type="button" data-sig-cancel>취소</button>
        <button type="button" class="primary" data-sig-save>저장</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);

  const canvas = backdrop.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = 4.5; ctx.lineCap = 'round'; ctx.strokeStyle = '#1b2a2e';
  let hasDrawing = false;
  if(existingSig){
    const img = new Image();
    img.onload = ()=>ctx.drawImage(img,0,0,canvas.width,canvas.height);
    img.src = existingSig;
    hasDrawing = true;
  }
  let drawing=false, last=null;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches?e.touches[0].clientX:e.clientX) - r.left;
    const cy = (e.touches?e.touches[0].clientY:e.clientY) - r.top;
    return {x:cx*canvas.width/r.width, y:cy*canvas.height/r.height};
  }
  function start(e){ e.preventDefault(); drawing=true; hasDrawing=true; last=pos(e); }
  function move(e){ if(!drawing) return; e.preventDefault(); const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; }
  function end(){ drawing=false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);

  function close(){ document.body.removeChild(backdrop); }
  backdrop.querySelector('[data-sig-clear]').onclick = ()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
    hasDrawing = false;
  };
  backdrop.querySelector('[data-sig-cancel]').onclick = close;
  backdrop.addEventListener('click', (e)=>{ if(e.target === backdrop) close(); });
  backdrop.querySelector('[data-sig-save]').onclick = ()=>{
    const dataUrl = hasDrawing ? canvas.toDataURL('image/png') : '';
    onSave(dataUrl);
    close();
  };
}

function bindFormInputs(el, f, readOnly){
  el.querySelectorAll('[data-field]').forEach(inp=>{
    inp.addEventListener('input', ()=>{ f[inp.getAttribute('data-field')] = inp.value; scheduleDraftSave(f); });
    inp.addEventListener('change', ()=>{ f[inp.getAttribute('data-field')] = inp.value; scheduleDraftSave(f); });
  });
  el.querySelectorAll('[data-radio-field]').forEach(inp=>{
    inp.addEventListener('change', ()=>{ f[inp.getAttribute('data-radio-field')] = inp.value; scheduleDraftSave(f); });
  });
  if(readOnly) return;
  const branchSel = el.querySelector('[data-field="branch"]');
  const nameInp = el.querySelector('[data-field="inspectorName"]');
  if(branchSel && nameInp){
    branchSel.addEventListener('change', ()=>{
      const def = INSPECTOR_DEFAULTS[branchSel.value];
      const isUntouched = !nameInp.value || Object.values(INSPECTOR_DEFAULTS).includes(nameInp.value);
      if(def && isUntouched){ nameInp.value = def; f.inspectorName = def; }
    });
  }
  const vendorSel = el.querySelector('[data-field="vendor"]');
  const teamList = el.querySelector(`datalist[id="teamlist-${f.id}"]`);
  if(vendorSel && teamList){
    vendorSel.addEventListener('change', ()=>{
      teamList.innerHTML = findVendorTeams(vendorSel.value).map(t=>`<option value="${esc(t)}">`).join("");
    });
  }
  el.querySelectorAll('[data-ck-result]').forEach(inp=>{
    inp.addEventListener('change', ()=>{ f.checklist[Number(inp.getAttribute('data-ck-result'))].result = inp.value; scheduleDraftSave(f); });
  });
  el.querySelectorAll('[data-ck-note]').forEach(inp=>{
    inp.addEventListener('input', ()=>{ f.checklist[Number(inp.getAttribute('data-ck-note'))].note = inp.value; scheduleDraftSave(f); });
  });
  el.querySelectorAll('[data-photo-input]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const idx = Number(inp.getAttribute('data-photo-input'));
      const file = inp.files && inp.files[0];
      if(!file) return;
      try{
        const dataUrl = await compressImageFile(file);
        f.checklist[idx].photo = dataUrl;
        renderSheet(el, f, readOnly);
        scheduleDraftSave(f);
      }catch(e){ toast("사진을 처리하지 못했습니다. 다시 시도해 주세요."); }
    });
  });
  el.querySelectorAll('[data-photo-clear]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = Number(btn.getAttribute('data-photo-clear'));
      f.checklist[idx].photo = "";
      renderSheet(el, f, readOnly);
      scheduleDraftSave(f);
    });
  });
}

async function submitForm(){
  const f = state.currentForm;
  if(!f.branch){ toast("관리지사를 선택해 주세요."); return; }
  if(!f.companyName){ toast("상호를 입력해 주세요."); return; }
  if(!f.vendor){ toast("협력사를 선택해 주세요."); return; }
  if(!f.teamName){ toast("협력사 팀명을 입력해 주세요."); return; }
  if(!f.visitType){ toast("점검방식(방문/영상통화)을 선택해 주세요."); return; }
  if(!f.caseType){ toast("구분(AS/공사현장)을 선택해 주세요."); return; }
  if(!f.siteAddress){ toast("현장주소를 입력해 주세요."); return; }
  // 체크리스트 항목이 비어있는 채로(혹은 사진 없이) 제출되던 것을 막는다 — "확인 안 한
  // 항목이 없다"를 실제로 보장하려면 결과 선택·사진 첨부가 전부 필수여야 하고, 미흡으로
  // 체크한 항목은 화면 안내 문구("미흡 시 보완사항 기재")대로 보완사항도 필수로 둔다.
  const missingResultIdx = f.checklist.findIndex(c=>!c.result);
  if(missingResultIdx >= 0){ toast(`${missingResultIdx+1}번 점검항목의 결과(양호/미흡)를 선택해 주세요.`); return; }
  const missingPhotoIdx = f.checklist.findIndex(c=>!c.photo);
  if(missingPhotoIdx >= 0){ toast(`${missingPhotoIdx+1}번 점검항목의 현장사진을 첨부해 주세요.`); return; }
  const missingNoteIdx = f.checklist.findIndex(c=>c.result==='bad' && !(c.note||'').trim());
  if(missingNoteIdx >= 0){ toast(`${missingNoteIdx+1}번 항목이 미흡입니다. 보완사항을 입력해 주세요.`); return; }
  const isEdit = !!state.editingRecordId;
  if(isEdit) f.updatedAt = new Date().toISOString();
  const key = "record:" + f.id;
  const ok = await sSet(key, JSON.stringify(f));
  if(ok){
    toast(isEdit ? "수정 내용이 저장되었습니다." : "점검 보고서가 저장되었습니다.");
    clearDraft(f.branch, f.inspectorName); // 정식 제출됐으니 남아 있던 임시저장 초안은 지운다
    // 알림은 "새로 접수된" 미흡 건에만 보낸다(수정 저장마다 매번 다시 보내면 관리자가
    // 같은 건을 두 번 세 번 고칠 때마다 알림이 반복돼 오히려 무시하게 됨).
    if(!isEdit && (f.checklist||[]).some(c=>c.result==='bad')) sendBadResultNotification(f);
    state.editingRecordId = null;
    await loadRecords();
    if(state.role === 'admin'){ state.view='admin'; render(); }
    else{ state.currentForm = blankForm(state.inspector); render(); }
  }else{
    toast("저장에 실패했습니다. 인터넷 연결을 확인해 주세요.");
  }
}

function getFilteredRecords(){
  const {q, branch, from, to, badOnly, missingPhoto, actionPending} = state.adminFilter;
  return scopedRecords().filter(r=>{
    if(branch && r.branch !== branch) return false;
    if(from && r.inspectDate < from) return false;
    if(to && r.inspectDate > to) return false;
    if(q){
      const hay = `${r.companyName} ${r.siteAddress} ${r.workerName} ${r.teamName}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    const hasBad = (r.checklist||[]).some(x=>x.result==='bad');
    if(badOnly && !hasBad) return false;
    if(missingPhoto && !(r.checklist||[]).some(x=>!x.photo)) return false;
    if(actionPending && !(hasBad && r.actionStatus!=='done')) return false;
    return true;
  });
}

function csvContentFor(rows){
  const header = ["점검일자","관리지사","점검자","직책","계약번호","상호","협력사","협력사팀명","작업자명","구분","방식","현장주소","점검결과","제출시각"];
  const lines = [header.join(",")];
  rows.forEach(r=>{
    const hasBad = (r.checklist||[]).some(x=>x.result==='bad');
    const cells = [r.inspectDate, r.branch, r.inspectorName||"", POSITION_BY_BRANCH(r.branch), r.contractNo||"", r.companyName, r.vendor||"", r.teamName||"", r.workerName||"", r.caseType||"", r.visitType||"", r.siteAddress, hasBad?"미흡":"양호", new Date(r.createdAt).toLocaleString('ko-KR')];
    lines.push(cells.map(c => `"${String(c==null?"":c).replace(/"/g,'""')}"`).join(","));
  });
  return "﻿" + lines.join("\r\n");
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function safeFileName(s){ return String(s||'').replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,'_').slice(0,80); }

function exportCSV(){
  const rows = getFilteredRecords();
  if(rows.length===0){ toast("내보낼 내역이 없습니다."); return; }
  downloadBlob(new Blob([csvContentFor(rows)], {type:'text/csv;charset=utf-8;'}), `AS_안전점검_${todayStr()}.csv`);
}

/* 사진 포함 엑셀 — 등록된 보고서를 한 줄에 한 건씩, 현장사진 4장을 썸네일로 셀에
   바로 박아 넣어 스크롤만으로 여러 건을 한눈에 훑어볼 수 있게 한다. CSV는 이미지를
   못 담으므로(텍스트 전용) 이 내보내기만 ExcelJS를 쓴다. 사진은 compressImageFile()
   에서 이미 JPEG·최대 720px·260KB 이하로 줄여 저장되므로 추가 리사이즈 없이 원본
   dataUrl을 그대로 셀 크기에 맞춰 넣기만 하면 된다.
   사진 크기(cm)는 사용자가 직접 조절 가능 — 기기별 화면 설정이라 Firestore가 아니라
   이 브라우저의 localStorage에만 저장, 다음에 열어도 마지막 쓴 값이 그대로 남는다. */
const PHOTO_XLSX_HEADERS = ["사진1(안전모)","사진2(사다리)","사진3(안전고리)","사진4(작업중)"];
const PHOTO_XLSX_SIZE_DEFAULT_CM = 3.7;
function getPhotoXlsxSizeCm(){
  try{
    const v = parseFloat(localStorage.getItem('asPhotoXlsxSizeCm'));
    return (v && v > 0) ? v : PHOTO_XLSX_SIZE_DEFAULT_CM;
  }catch(e){ return PHOTO_XLSX_SIZE_DEFAULT_CM; }
}
function setPhotoXlsxSizeCm(cm){
  try{ localStorage.setItem('asPhotoXlsxSizeCm', String(cm)); }catch(e){}
}
async function exportPhotoExcel(rows, sizeCm){
  if(rows.length===0){ toast("내보낼 내역이 없습니다."); return; }
  if(typeof ExcelJS === 'undefined'){ toast("엑셀 기능을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요."); return; }
  // 범위를 벗어나거나 숫자가 아닌 값이 들어오면(빈칸, 오타 등) 조용히 기본값으로
  // 대체한다 — 크기 하나 잘못 입력했다고 내보내기 자체가 막히면 안 되므로.
  const cm = (typeof sizeCm === 'number' && sizeCm > 0 && sizeCm <= 15) ? sizeCm : PHOTO_XLSX_SIZE_DEFAULT_CM;
  toast(`${rows.length}건의 사진(${cm}cm)을 포함해 엑셀을 만드는 중입니다... 잠시만 기다려 주세요.`);
  // toast()는 CSS 트랜지션이라 실제로 화면에 그려질 시간을 한 틱 줘야, 무거운 이미지
  // 삽입 루프가 시작되기 전에 사용자에게 "처리 중" 문구가 먼저 보인다.
  await new Promise(r=>setTimeout(r, 30));

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet("AS 안전점검");
  const header = ["순번","점검일자","관리지사","점검자","직책","계약번호","상호","협력사","협력사팀명","작업자명","구분","방식","현장주소","점검결과","비고","제출시각", ...PHOTO_XLSX_HEADERS];
  ws.addRow(header);
  const headerRow = ws.getRow(1);
  headerRow.font = { bold:true };
  headerRow.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFE9F1EE'} };
  headerRow.alignment = { horizontal:'center', vertical:'middle' };

  const PHOTO_COL_START = header.length - PHOTO_XLSX_HEADERS.length + 1; // 1-based
  const THUMB_PX = cm / 2.54 * 96; // cm -> px (96dpi 기준)

  rows.forEach((r, i)=>{
    const hasBad = (r.checklist||[]).some(x=>x.result==='bad');
    const rowVals = [
      i+1, r.inspectDate, r.branch, r.inspectorName||"", POSITION_BY_BRANCH(r.branch), r.contractNo||"",
      r.companyName, r.vendor||"", r.teamName||"", r.workerName||"", r.caseType||"", r.visitType||"",
      r.siteAddress, hasBad?"미흡":"양호", r.remarks||"", new Date(r.createdAt).toLocaleString('ko-KR'),
      "", "", "", "", // 사진 칸 4개 — 텍스트 대신 아래에서 이미지를 얹으므로 빈칸으로 둠
    ];
    const excelRow = ws.addRow(rowVals);
    const rowNumber = excelRow.number;
    excelRow.height = THUMB_PX * 0.75; // 포인트 단위(1px ≈ 0.75pt, 96dpi 기준) — 이미지가 셀 높이에 딱 맞음
    excelRow.alignment = { vertical:'middle' };

    (r.checklist||[]).forEach((item, ci)=>{
      if(ci >= PHOTO_XLSX_HEADERS.length) return; // CHECK_ITEMS 개수가 늘어도 헤더 밖으로는 안 넘어가게 방어
      if(!item.photo) return;
      try{
        const base64 = item.photo.split(',')[1] || item.photo;
        const imgId = wb.addImage({ base64, extension:'jpeg' });
        // tl(top-left)은 0-based 행/열이라 -1 보정. 셀 안에 딱 맞는 3.7x3.7cm(THUMB_PX) 고정 크기로 얹는다
        // (셀 크기에 맞춰 늘어나는 방식이 아니라 절대 픽셀 크기 오버레이라, 컬럼 폭·행 높이를
        // THUMB_PX 크기(3.7cm)에 맞게 미리 지정해둬야 잘리거나 남는 여백 없이 깔끔하게 보인다).
        ws.addImage(imgId, {
          tl: { col: PHOTO_COL_START - 1 + ci, row: rowNumber - 1 },
          ext: { width: THUMB_PX, height: THUMB_PX },
        });
      }catch(e){ /* 개별 사진이 깨져 있어도 나머지 행 처리는 계속 진행 */ }
    });
  });

  // 열 너비: 앞쪽 텍스트 열은 내용에 맞춰 적당히, 사진 열 4개는 THUMB_PX(3.7cm)에
  // 맞춤. 현장주소·비고는 길어질 수 있어 조금 더 넓게 잡는다.
  const textWidths = [6, 11, 10, 9, 8, 11, 16, 12, 12, 10, 7, 7, 24, 8, 20, 16];
  ws.columns = [...textWidths, ...PHOTO_XLSX_HEADERS.map(()=>THUMB_PX/7)].map(w=>({ width:w }));
  ws.views = [{ state:'frozen', ySplit:1 }];

  const thin = { style:'thin', color:{argb:'FFB9C6C2'} };
  for(let rr=1; rr<=rows.length+1; rr++){
    for(let cc=1; cc<=header.length; cc++){
      ws.getCell(rr,cc).border = { top:thin, left:thin, bottom:thin, right:thin };
    }
  }

  const buf = await wb.xlsx.writeBuffer();
  downloadBlob(new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), `AS_안전점검_사진포함_${todayStr()}.xlsx`);
  toast(`${rows.length}건, 사진 포함 엑셀 다운로드가 시작되었습니다.`);
}

/* ============================================================
   PDF 내보내기 (html2canvas + jsPDF)
   ------------------------------------------------------------
   window.print()는 항상 브라우저 인쇄창을 거쳐야 해서 스크립트로 바로
   다운로드용 PDF 파일(Blob)을 만들 수 없다 — 그래서 각 보고서를 화면
   밖(-99999px)의 숨은 iframe에 print-ready HTML(buildStaticDocument)로
   그려 넣고, 그 iframe 안에서만 인쇄용 CSS(@media print)가 화면에도
   똑같이 적용되도록("@media print" → "@media print, screen") 살짝
   바꿔치기한 뒤, html2canvas로 캡처해서 jsPDF에 이미지로 붙인다. 이렇게
   하면 실제 인쇄했을 때와 똑같은 압축된 레이아웃 그대로 PDF가 만들어진다.
   ============================================================ */
async function renderRecordCanvas(record){
  const printReadyHtml = buildStaticDocument(record).replace(/@media print/g, '@media print, screen');
  const iframe = document.createElement('iframe');
  iframe.style.cssText = 'position:fixed;left:-99999px;top:0;width:793px;height:1123px;border:0;';
  document.body.appendChild(iframe);
  await new Promise(resolve=>{
    iframe.onload = resolve;
    iframe.srcdoc = printReadyHtml;
  });
  const idoc = iframe.contentDocument;
  // html2canvas는 <select>의 네이티브 렌더링을 제대로 캡처하지 못해(빈 칸이나
  // 깨진 화살표로 나옴) 관리지사 드롭다운이 이상하게 찍힌다 — 캡처 직전에
  // select를 선택된 값 그대로의 일반 텍스트로 바꿔치기한다(어차피 읽기전용).
  idoc.querySelectorAll('select').forEach(sel=>{
    const span = idoc.createElement('span');
    span.textContent = sel.value || '';
    sel.replaceWith(span);
  });
  try{ await iframe.contentWindow.document.fonts.ready; }catch(e){}
  await new Promise(r=>setTimeout(r, 200));
  const canvas = await html2canvas(idoc.body, {scale:2, backgroundColor:'#ffffff', windowWidth:793});
  document.body.removeChild(iframe);
  return canvas;
}

function addCanvasAsPage(pdf, canvas, isFirstPage){
  const pageWmm = 210, pageHmm = 297;
  let imgHmm = canvas.height / canvas.width * pageWmm;
  if(imgHmm > pageHmm) imgHmm = pageHmm; // 내용이 살짝 넘치면 잘리는 대신 페이지 안에 눌러 맞춘다
  if(!isFirstPage) pdf.addPage();
  pdf.addImage(canvas.toDataURL('image/jpeg', 0.85), 'JPEG', 0, 0, pageWmm, imgHmm);
}

function pdfLibsReady(){
  return typeof html2canvas !== 'undefined' && window.jspdf && window.jspdf.jsPDF;
}

async function exportZipPdfEach(rows, filename){
  if(!pdfLibsReady() || typeof JSZip === 'undefined'){ toast("PDF 변환 기능을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요."); return; }
  toast(`${rows.length}건을 PDF로 변환하는 중입니다... 잠시만 기다려 주세요.`);
  const { jsPDF } = window.jspdf;
  const zip = new JSZip();
  const used = {};
  for(const r of rows){
    const canvas = await renderRecordCanvas(r);
    const pdf = new jsPDF({unit:'mm', format:'a4'});
    addCanvasAsPage(pdf, canvas, true);
    let base = safeFileName(`${r.inspectDate}_${r.branch||''}_${r.companyName||'점검'}`);
    if(used[base]!=null){ used[base]++; base += '_'+used[base]; } else used[base]=0;
    zip.file(`${base}.pdf`, pdf.output('blob'));
  }
  zip.file(`제출내역_${todayStr()}.csv`, csvContentFor(rows));
  const blob = await zip.generateAsync({type:'blob'});
  downloadBlob(blob, filename);
  toast("PDF 압축파일 다운로드가 시작되었습니다.");
}

async function exportCombinedPdf(rows, filename){
  if(!pdfLibsReady()){ toast("PDF 변환 기능을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요."); return; }
  toast(`${rows.length}건을 하나의 PDF로 합치는 중입니다... 잠시만 기다려 주세요.`);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:'mm', format:'a4'});
  for(let i=0;i<rows.length;i++){
    const canvas = await renderRecordCanvas(rows[i]);
    addCanvasAsPage(pdf, canvas, i===0);
  }
  downloadBlob(pdf.output('blob'), filename);
  toast("PDF 다운로드가 시작되었습니다.");
}

/* ============================================================
   일일 집계 보고 — 관리본부 사업지원팀이 매일 메일로 보내는 집계표를
   그대로 만들어 준다. 표는 이메일 편집기(KT 그룹메일 등)가 그대로
   붙여넣기 받아들일 수 있도록 인라인 style로만 구성한다(<style> 태그나
   외부 CSS는 메일 클라이언트에서 대부분 제거되기 때문).
   ============================================================ */
function dailyReportHeaders(){

function dailyReportRowCells(r){
  const hasBad = (r.checklist||[]).some(x=>x.result==='bad');
  return [r.inspectDate, r.branch, r.inspectorName||"", POSITION_BY_BRANCH(r.branch), r.contractNo||"", r.companyName||"", r.vendor||"", r.teamName||"", r.workerName||"", r.caseType||"", r.visitType||"", hasBad?"미흡":"양호"];

function buildDailyReportHtmlTable(rows){
  const thStyle = "border:1px solid #333;background:#0a3b45;color:#fff;padding:6px 8px;font-size:12px;white-space:nowrap;font-family:'Malgun Gothic',Arial,sans-serif;";
  const tdStyle = "border:1px solid #333;padding:6px 8px;font-size:12px;font-family:'Malgun Gothic',Arial,sans-serif;";
  const headRow = `<tr>${dailyReportHeaders().map(h=>`<th style="${thStyle}">${esc(h)}</th>`).join("")}</tr>`;
  const bodyRows = rows.map(r=>`<tr>${dailyReportRowCells(r).map(c=>`<td style="${tdStyle}">${esc(c)}</td>`).join("")}</tr>`).join("");
  return `<table style="border-collapse:collapse;">${headRow}${bodyRows}</table>`;
}

/* ============================================================
   협력사·공사팀 관리자 등록/수정/일괄업로드
   ============================================================ */
function parseCsv(text){
  if(text.charCodeAt(0)===0xFEFF) text = text.slice(1);
  const rows = [];
  let i=0, field='', row=[], inQuotes=false;
  while(i<text.length){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field+='"'; i+=2; continue; }
        inQuotes = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if(c === '"'){ inQuotes = true; i++; continue; }
    if(c === ','){ row.push(field); field=''; i++; continue; }
    if(c === '\r'){ i++; continue; }
    if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
    field += c; i++;
  }
  row.push(field); rows.push(row);
  return rows.filter(r=>!(r.length===1 && r[0]===''));
}

          <button type="button" data-add-team="${vi}" style="padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:12px;">+ 팀 추가</button>
        </div>
      </div>
    `).join("");
    listEl.querySelectorAll('[data-del-vendor]').forEach(btn=>{
      btn.onclick = async ()=>{
        state.vendors.splice(Number(btn.getAttribute('data-del-vendor')), 1);
        await saveVendors(); renderList();
      };
    });
    listEl.querySelectorAll('[data-del-team]').forEach(btn=>{
      btn.onclick = async ()=>{
        const [vi,ti] = btn.getAttribute('data-del-team').split(':').map(Number);
        state.vendors[vi].teams.splice(ti,1);
        await saveVendors(); renderList();
      };
    });
    listEl.querySelectorAll('[data-add-team]').forEach(btn=>{
      btn.onclick = async ()=>{
        const vi = Number(btn.getAttribute('data-add-team'));
        const inp = listEl.querySelector(`[data-team-input="${vi}"]`);
        const name = inp.value.trim();
        if(!name) return;
        if(!state.vendors[vi].teams.includes(name)) state.vendors[vi].teams.push(name);
        await saveVendors(); renderList();
      };
    });
  }
  renderList();

  backdrop.querySelector('#add-vendor-btn').onclick = async ()=>{
    const inp = backdrop.querySelector('#new-vendor-name');
    const name = inp.value.trim();
    if(!name) return;
    if(state.vendors.some(v=>v.name===name)){ toast("이미 등록된 협력사입니다."); return; }
    state.vendors.push({name, teams:[]});
    inp.value = '';
    await saveVendors(); renderList();
  };

  backdrop.querySelector('#vendor-template').onclick = ()=>{
    const csv = "﻿협력사,공사팀명\r\n비즈메이드,비즈메이드(강북) 3팀\r\n비즈메이드,비즈메이드(강북) 6팀\r\n지앤씨씨,지앤씨씨(강원) 1팀\r\n";
    downloadBlob(new Blob([csv], {type:'text/csv;charset=utf-8;'}), "협력사_공사팀_예시.csv");
  };

  backdrop.querySelector('#vendor-upload').addEventListener('change', async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const text = await file.text();
    const rows = parseCsv(text);
    let addedVendors = 0, addedTeams = 0;
    rows.forEach((cols, idx)=>{
      if(idx===0 && /협력사/.test(cols[0]||'')) return; // 헤더 행 건너뜀
      const vendorName = (cols[0]||'').trim();
      const teamName = (cols[1]||'').trim();
      if(!vendorName) return;
      let v = state.vendors.find(x=>x.name===vendorName);
      if(!v){ v = {name:vendorName, teams:[]}; state.vendors.push(v); addedVendors++; }
      if(teamName && !v.teams.includes(teamName)){ v.teams.push(teamName); addedTeams++; }
    });
    await saveVendors();
    renderList();
    toast(`협력사 ${addedVendors}건, 공사팀 ${addedTeams}건이 추가되었습니다.`);
    e.target.value = '';
  });
}

async function exportZip(rows, filename){
  if(typeof JSZip === 'undefined'){ toast("압축 기능을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요."); return; }
  if(rows.length===0){ toast("압축할 내역이 없습니다."); return; }
  toast(`${rows.length}건을 압축하는 중입니다...`);
  const zip = new JSZip();
  const used = {};
  rows.forEach(r=>{
    let base = safeFileName(`${r.inspectDate}_${r.branch||''}_${r.companyName||'점검'}`);
    if(used[base]!=null){ used[base]++; base += '_'+used[base]; } else used[base]=0;
    zip.file(`${base}.html`, buildStaticDocument(r));
  });
  zip.file(`제출내역_${todayStr()}.csv`, csvContentFor(rows));
  const blob = await zip.generateAsync({type:"blob"});
  downloadBlob(blob, filename);
  toast("압축파일 다운로드가 시작되었습니다.");
}

/* 월별 추이 — 제출일자(inspectDate) 기준 최근 6개월(이번 달 포함)을 항상 표시한다.
   그 달에 제출이 0건이어도 막대가 아예 안 보이면 "그 달 데이터가 없다"와 "그 달만
   빠졌다"를 구분할 수 없으므로, 0건인 달도 빈 막대로 그대로 넣는다. */
function monthKeysBack(n){
  const out = [];
  const now = new Date();
  for(let i=n-1; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }
  return out;
}
function renderTrendChart(){
  const el = document.getElementById('trend-chart');
  if(!el) return;
  const months = monthKeysBack(6);
  const records = scopedRecords();
  const rows = months.map(m=>{
    const inMonth = records.filter(r=>(r.inspectDate||"").slice(0,7)===m);
    const bad = inMonth.filter(r=>(r.checklist||[]).some(x=>x.result==='bad')).length;
    return { m, total: inMonth.length, bad };
  });
  const max = Math.max(1, ...rows.map(r=>r.total));
  el.innerHTML = rows.map(r=>{
    const totalPct = Math.round(r.total/max*100);
    const badPct = r.total>0 ? Math.round(r.bad/r.total*totalPct) : 0;
    return `<div class="trend-row">
      <div class="lb">${r.m}</div>
      <div class="trend-track">
        <div class="trend-fill-total" style="width:${totalPct}%;"></div>
        <div class="trend-fill-bad" style="width:${badPct}%;"></div>
      </div>
      <div class="vv">${r.total}건${r.bad?` (미흡 ${r.bad})`:''}</div>
    </div>`;
  }).join("");
}

/* 지사별 미흡 순위 — 미흡 건수가 많은 지사부터, 동률이면 미흡률(%)이 높은 순.
   해당 지사에서 제출이 아예 없으면(0건) 순위표에서 제외(분모 0으로 나누기 방지 겸,
   활동이 없는 지사까지 표에 채우면 오히려 실제 위험 지사를 찾기 어려워짐). */
function renderBranchRank(){
  const el = document.getElementById('branch-rank');
  if(!el) return;
  const byBranch = {};
  scopedRecords().forEach(r=>{
    if(!r.branch) return;
    byBranch[r.branch] = byBranch[r.branch] || {total:0, bad:0};
    byBranch[r.branch].total++;
    if((r.checklist||[]).some(x=>x.result==='bad')) byBranch[r.branch].bad++;
  });
  const rows = Object.entries(byBranch).map(([branch, d])=>({branch, ...d, pct: d.total ? Math.round(d.bad/d.total*100) : 0}))
    .sort((a,b)=> b.bad-a.bad || b.pct-a.pct);
  if(rows.length===0){ el.innerHTML = `<div class="empty">제출 내역이 없습니다.</div>`; return; }
  el.innerHTML = `<table class="rank-table">
    <tr><th>지사</th><th style="text-align:right;">제출 건수</th><th style="text-align:right;">미흡 건수</th><th style="text-align:right;">미흡률</th></tr>
    ${rows.map(r=>`<tr><td>${esc(r.branch)}</td><td class="num">${r.total}</td><td class="num">${r.bad}</td><td class="pct">${r.pct}%</td></tr>`).join("")}
  </table>`;
}

/* 협력사·공사팀별 미흡 이력 — 반복적으로 미흡이 나오는 협력사/팀을 데이터로
   추적하기 위함. 협력사만으로 묶으면 같은 협력사 안의 여러 팀 실적이 뭉개지므로
   "협력사 / 팀명" 조합을 한 행으로 잡는다(팀명이 없으면 "(팀 미지정)"으로 묶음).
   지사별 순위와 마찬가지로 제출이 아예 없는 조합은 표에서 제외. */
function renderVendorRank(){
  const el = document.getElementById('vendor-rank');
  if(!el) return;
  const byVendor = {};
  scopedRecords().forEach(r=>{
    if(!r.vendor) return;
    const key = `${r.vendor}||${r.teamName || '(팀 미지정)'}`;
    byVendor[key] = byVendor[key] || {vendor:r.vendor, team:r.teamName||'(팀 미지정)', total:0, bad:0};
    byVendor[key].total++;
    if((r.checklist||[]).some(x=>x.result==='bad')) byVendor[key].bad++;
  });
  const rows = Object.values(byVendor).map(d=>({...d, pct: d.total ? Math.round(d.bad/d.total*100) : 0}))
    .sort((a,b)=> b.bad-a.bad || b.pct-a.pct);
  if(rows.length===0){ el.innerHTML = `<div class="empty">제출 내역이 없습니다.</div>`; return; }
  el.innerHTML = `<table class="rank-table">
    <tr><th>협력사</th><th>공사팀</th><th style="text-align:right;">제출 건수</th><th style="text-align:right;">미흡 건수</th><th style="text-align:right;">미흡률</th></tr>
    ${rows.map(r=>`<tr><td>${esc(r.vendor)}</td><td>${esc(r.team)}</td><td class="num">${r.total}</td><td class="num">${r.bad}</td><td class="pct">${r.pct}%</td></tr>`).join("")}
  </table>`;
}

          <td>${statusBadge}</td>
          <td class="mono" style="font-size:11.5px;">${new Date(r.createdAt).toLocaleString('ko-KR')}</td>
          <td><div class="rowbtns">
            ${hasBad ? `<button class="btn ${done?'ghost':'warn'}" data-action="${r.id}">${done?'조치 내역':'조치 처리'}</button>` : ''}
            <button class="btn ghost" data-view="${r.id}">보기</button>
            <button class="btn" data-edit="${r.id}">수정</button>
            <button class="btn danger" data-del="${r.id}">삭제</button>
          </div></td>
        </tr>`;
      }).join("")}
    </table>
  `;
  const selectAllCb = wrap.querySelector('#select-all-rows');
  selectAllCb.checked = rows.every(r=>state.selectedIds.has(r.id));
  selectAllCb.onchange = ()=>{
    rows.forEach(r=>{
      if(selectAllCb.checked) state.selectedIds.add(r.id); else state.selectedIds.delete(r.id);
    });
    renderAdminList();
  };
  wrap.querySelectorAll('.row-check').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const id = cb.getAttribute('data-id');
      if(cb.checked) state.selectedIds.add(id); else state.selectedIds.delete(id);
      updateSelectedCount();
      selectAllCb.checked = rows.every(r=>state.selectedIds.has(r.id));
    });
  });
  wrap.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const rec = state.records.find(r=>r.id===btn.getAttribute('data-edit'));
      state.currentForm = JSON.parse(JSON.stringify(rec));
      state.editingRecordId = rec.id;
      state.view = "form";
      renderFormInto(document.getElementById('viewport'), {fromAdmin:true});
    });
  });
  wrap.querySelectorAll('[data-view]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const rec = state.records.find(r=>r.id===btn.getAttribute('data-view'));
      state.currentForm = rec;
      state.view = "form";
      renderFormInto(document.getElementById('viewport'), {readOnly:true, fromAdmin:true});
    });
  });
  wrap.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-del');
      if(!confirm("이 점검 보고서를 삭제하시겠습니까? 되돌릴 수 없습니다.")) return;
      await sDelete("record:"+id);
      state.records = state.records.filter(r=>r.id!==id);
      state.selectedIds.delete(id);
      renderAdminList(); renderStats();
      toast("삭제되었습니다.");
    });
  });
  wrap.querySelectorAll('[data-action]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const rec = state.records.find(r=>r.id===btn.getAttribute('data-action'));
      if(rec) openActionStatusModal(rec);
    });
  });
}

/* 미흡 항목 시정조치(후속조치) 상태 — 체크리스트 개별 항목이 아니라 보고서 1건 단위로
   관리한다(항목별로 쪼개면 UI가 크게 복잡해지는데, 실제로는 "이 건에서 지적된 미흡
   사항이 전부 해결됐는지" 하나만 추적해도 충분하다는 판단). record 자체의
   actionStatus/actionDate/actionBy/actionNote 필드에 저장하고, 다른 필드 수정과
   똑같이 Firestore의 그 record 문서를 그대로 덮어쓴다. */
async function updateActionStatus(id, patch){
  const rec = state.records.find(r=>r.id===id);
  if(!rec) return false;
  Object.assign(rec, patch);
  const ok = await sSet("record:"+id, JSON.stringify(rec));
  return !!ok;
}
function openActionStatusModal(rec){
  const backdrop = document.createElement('div');
  backdrop.className = 'export-modal-backdrop';
  const done = rec.actionStatus === 'done';
  backdrop.innerHTML = `
    <div class="export-modal" style="max-width:480px;">
      <h3>시정조치 처리</h3>
      <div class="hint">${esc(rec.inspectDate)} · ${esc(rec.branch||'-')} · ${esc(rec.companyName||'-')}<br>${esc(rec.siteAddress||'-')}</div>
      <div style="margin:12px 0;">
        <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;cursor:pointer;">
          <input type="checkbox" id="action-done-cb" ${done?'checked':''}> 조치완료로 표시
        </label>
      </div>
      <div class="field" style="margin-bottom:10px;">
        <label style="font-size:12px;color:var(--ink-soft);">조치자</label>
        <input type="text" id="action-by" value="${esc(rec.actionBy||'')}" placeholder="조치한 사람 이름" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:13px;">
      </div>
      <div class="field" style="margin-bottom:10px;">
        <label style="font-size:12px;color:var(--ink-soft);">조치일자</label>
        <input type="date" id="action-date" value="${esc(rec.actionDate||'')}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:13px;">
      </div>
      <div class="field" style="margin-bottom:10px;">
        <label style="font-size:12px;color:var(--ink-soft);">조치내용</label>
        <textarea id="action-note" rows="3" placeholder="어떻게 조치했는지 기록" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:13px;">${esc(rec.actionNote||'')}</textarea>
      </div>
      <div style="display:flex;gap:8px;">
        <button type="button" class="cancel" id="action-save" style="width:auto;padding:8px 14px;background:var(--brand-deep);color:#fff;border-color:var(--brand-deep);">저장</button>
        <button type="button" class="cancel" data-cancel style="width:auto;padding:8px 14px;">닫기</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  const close = ()=>{ if(backdrop.parentNode) document.body.removeChild(backdrop); };
  backdrop.querySelector('[data-cancel]').onclick = close;
  backdrop.addEventListener('click', (e)=>{ if(e.target === backdrop) close(); });
  backdrop.querySelector('#action-save').onclick = async ()=>{
    const isDone = backdrop.querySelector('#action-done-cb').checked;
    const patch = {
      actionStatus: isDone ? 'done' : '',
      actionBy: backdrop.querySelector('#action-by').value.trim(),
      actionDate: backdrop.querySelector('#action-date').value,
      actionNote: backdrop.querySelector('#action-note').value.trim(),
    };
    const ok = await updateActionStatus(rec.id, patch);
    if(ok){ toast("시정조치 내역이 저장되었습니다."); renderAdminList(); renderStats(); close(); }
    else{ toast("저장에 실패했습니다. 인터넷 연결을 확인해 주세요."); }
  };
}

function updateSelectedCount(){
  const el = document.getElementById('selected-count');
  if(el) el.textContent = `${state.selectedIds.size}건 선택됨`;
}

/* QR 검증 페이지 — 인쇄물의 QR을 스캔하면 여는, 로그인 없이 보는 읽기 전용 화면.
   이 앱은 기존에도 관리자 비밀번호(ADMIN_PASSWORD)가 화면 안에 그대로 노출돼 있고
   sGet()/sListValues()가 별도 인증 없이 Firestore를 읽는 구조라(로그인 자체가
   "이 화면을 볼 자격"을 표시하는 관례적 장치일 뿐, 서버 쪽 접근 제어는 아님),
   이 페이지 하나만 별도로 더 열어준다고 해서 새로운 종류의 노출이 생기는 건
   아니다 — 기존 보안 모델을 그대로 따른 것. */
async function renderVerifyView(id){
  document.body.innerHTML = `<main style="max-width:900px;margin:0 auto;padding:20px 16px 60px;">
    <div class="sheet" id="verify-sheet" style="padding:20px;">불러오는 중...</div>
  </main>`;
  const raw = await sGet("record:" + id);
  const wrap = document.getElementById('verify-sheet');
  if(!raw){
    wrap.innerHTML = `<div class="empty" style="padding:60px 20px;text-align:center;">존재하지 않거나 삭제된 보고서입니다.</div>`;
    return;
  }
  let f;
  try{ f = JSON.parse(raw); }catch(e){ wrap.innerHTML = `<div class="empty" style="padding:60px 20px;text-align:center;">기록을 읽는 중 문제가 발생했습니다.</div>`; return; }
  wrap.innerHTML = sheetOuterHTML(f, 'disabled');
}

(async function boot(){
  // 인쇄물 QR(?verify=<id>)로 들어온 경우엔 로그인 화면 없이 바로 그 보고서만
  // 읽기 전용으로 보여주고 끝낸다 — 일반 로그인/부트 흐름(state.vendors 로드 등)은
  // 필요 없음.
  const verifyId = new URLSearchParams(location.search).get('verify');
  if(verifyId){ await renderVerifyView(verifyId); return; }
  state.vendors = await loadVendors();
  render();
})();
</script>
